# Copia diaria de la base de PRODUCCIÓN, fuera de la máquina del desarrollador
# y fuera de OneDrive (hallazgo R-07). Complementa —no reemplaza— al backup
# diario local (`npm run db:backup:daily` + Programador de tareas de Windows).
#
# Qué hace: el mismo `mysqldump` verificado que usa el release
# (`scripts/release/db-backup.mjs` — gzip íntegro + trailer + cantidad de
# tablas), y sube el `.sql.gz` como artifact del workflow (retención 90 días).
#
# Requisito único: el secret `MYSQL_PUBLIC_URL` en
# Settings → Secrets and variables → Actions → New repository secret,
# con la URL PÚBLICA de la base en Railway (MySQL → Connect → Public Network).
# Es la credencial completa de producción viviendo en GitHub: sólo aceptable
# con el repo privado y el acceso restringido. Si se filtra, rotarla en Railway.
#
# Para pasar de artifact a un bucket (Cloudflare R2 / Backblaze B2), ver
# docs/project-brain/12-BACKUP-EN-LA-NUBE.md — el paso de subida es lo único
# que cambia.

name: Backup diario de la base (producción)

on:
  schedule:
    # 06:20 UTC ≈ 03:20 en Argentina (UTC-3), horario de bajo tráfico.
    # El cron de GitHub Actions puede demorarse varios minutos: no pasa nada.
    - cron: "20 6 * * *"
  workflow_dispatch: {} # permite correrlo a mano desde la pestaña Actions (sólo si el workflow está en la rama por defecto)
  # TEMPORAL — SACAR ANTES DE MERGEAR A master.
  # `workflow_dispatch` y `schedule` sólo funcionan desde la rama por defecto,
  # así que para probar el workflow mientras vive en `chore/db-prod-protection`
  # se dispara en cada push a ESA rama. El filtro por nombre de rama hace que
  # nunca corra en master, pero igual conviene borrar este bloque en el merge.
  push:
    branches: [chore/db-prod-protection]

concurrency:
  group: db-backup
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # db-backup.mjs y sus utilidades usan sólo módulos nativos de Node
      # (node:fs, node:zlib, node:child_process...), así que NO hace falta
      # `npm ci`. Sólo el cliente de MySQL.
      - name: Instalar mysqldump
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends mysql-client

      - name: Backup verificado de producción
        env:
          MYSQL_PUBLIC_URL: ${{ secrets.MYSQL_PUBLIC_URL }}
        run: |
          if [ -z "${MYSQL_PUBLIC_URL}" ]; then
            echo "::error::Falta el secret MYSQL_PUBLIC_URL (Settings → Secrets and variables → Actions)."
            exit 1
          fi
          node scripts/release/db-backup.mjs --tag=cloud

      - name: Subir el dump como artifact
        uses: actions/upload-artifact@v4
        with:
          name: db-backup-${{ github.run_id }}
          path: .releases/db/cloud-*.sql.gz
          retention-days: 90
          if-no-files-found: error

      # GitHub ya envía un mail al admin del repo cuando un workflow falla.
      # Si se quiere además el aviso por el canal del sistema (CallMeBot), sumar
      # acá un step `if: failure()` con un curl y el secret correspondiente.
